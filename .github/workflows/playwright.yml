name: Testes E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar os navegadores (Chromium, Chrome, Edge, Firefox e WebKit)
        run: npx playwright install --with-deps chromium chrome msedge firefox webkit

      # O relatório HTML não é publicado: traces e contexto de erro registram o que é
      # digitado nos campos, inclusive a senha, e o repositório é público. O log mostra
      # qual teste falhou e o erro; prints e trace, só rodando localmente.
      - name: Rodar os testes
        run: npm test
        env:
          USUARIO: ${{ secrets.USUARIO }}
          SENHA: ${{ secrets.SENHA }}
